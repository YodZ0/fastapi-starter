version: 1
disable_existing_loggers: false

# "$log_level" is substituted by setup_logging() before this file is parsed,
# so verbosity comes from the settings and this file is environment agnostic.

# "request_id" comes from the context variable set by the request id
# middleware and is "-" outside of a request. The filter is attached to the
# handlers, so records of third party loggers carry it as well.
filters:
  request_id:
    (): src.logs.RequestIdFilter

formatters:
  standard:
    format: "[%(levelname)s][%(asctime)s][%(request_id)s] - %(name)s : %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "[%(levelname)s][%(asctime)s][%(request_id)s] - %(name)s [%(filename)s:%(funcName)s:%(lineno)d] : %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  # Neither handler sets a level: the loggers below are the only place where
  # verbosity is decided.
  console:
    class: logging.StreamHandler
    formatter: detailed
    filters: [ request_id ]
    stream: ext://sys.stdout

  # For records whose source location points into a library rather than into
  # our own code, so the file:function:line part carries no information.
  console_plain:
    class: logging.StreamHandler
    formatter: standard
    filters: [ request_id ]
    stream: ext://sys.stdout

loggers:
  # Must match the top-level package name: modules call
  # logging.getLogger(__name__), which yields "src.<module>". A logger named
  # after anything else here is simply never used, and application records fall
  # through to root instead.
  src:
    level: "$log_level"
    handlers: [ console ]
    propagate: false

  # Uvicorn installs its own handlers and formatters at startup. Naming its
  # loggers here drops those handlers, otherwise its records keep uvicorn's
  # own format and never reach the handlers configured above.
  uvicorn:
    level: INFO
    handlers: [ console_plain ]
    propagate: false

  uvicorn.error:
    level: INFO
    propagate: true

  uvicorn.access:
    level: INFO
    propagate: true

  # Noisy third parties: at DEBUG they bury the application output.
  # sqlalchemy.engine logs every statement it runs at INFO.
  sqlalchemy.engine:
    level: WARNING

  alembic:
    level: INFO

  asyncio:
    level: WARNING

root:
  level: "$log_level"
  handlers: [ console ]
