[project]
name = "fastapi-starter"
version = "0.1.0"
description = "FastAPI application template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "dishka>=1.10.1",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "typer>=0.27.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "testcontainers[postgres]>=4.9",
    "types-pyyaml>=6.0.12",
]

# ============ #
#     ruff     #
# ============ #

[tool.ruff]
target-version = "py313"
line-length = 88
# Generated migrations are not hand-written code; linting them only produces
# noise on every `alembic revision`.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Selected explicitly rather than relying on the default set: ruff expands its
# defaults between releases, and a template should not change what it enforces
# just because the pinned version moved.
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "PT", # flake8-pytest-style
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    # PEP 695 type parameters. CRUDRepository resolves its model and schema
    # types at runtime by reading __orig_bases__, which the new syntax does not
    # expose the same way - the class cannot be migrated without rewriting that
    # machinery.
    "UP046",
    "UP047",
    # Conflicts with the formatter.
    "W191",
    "E111",
    "E117",
    # BusinessLogicException is the abstract base of the error hierarchy; its
    # concrete subclasses all do end in `Error`. Renaming the base is a call for
    # the maintainer, not the linter.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point (S101), credentials in fixtures are fake by
# construction (S105, S106), and fixtures do not need return types.
"tests/**" = ["S101", "S105", "S106", "ANN"]
# Alembic scaffolding is upstream-generated.
"alembic/env.py" = ["ANN", "ERA001"]

[tool.ruff.lint.flake8-annotations]
# Annotating `self`/`cls` adds nothing.
suppress-dummy-args = true
mypy-init-return = true

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ============ #
#     mypy     #
# ============ #

[tool.mypy]
python_version = "3.13"
# Teaches mypy about pydantic's synthesized __init__ - without it every
# `Settings()` call reports the env-populated fields as missing arguments.
plugins = ["pydantic.mypy"]
files = ["src", "alembic", "tests"]
# Generated by `alembic revision`, not written by hand.
exclude = ["^alembic/versions/"]

# The codebase passes --strict as-is, so it is set wholesale rather than as a
# hand-picked subset: nothing here had to be relaxed to make it green.
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# ============ #
#    pytest    #
# ============ #

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-vvv --strict-markers --strict-config"
pythonpath = ["."]
markers = ["integration: requires a live Postgres in Docker"]
filterwarnings = ["error"]
asyncio_mode = "auto"
# To keep tests isolated use transaction, not event loop.
# A common loop is needed so that the session-scoped engine and asyncpg-connections
# live in the same place as the tests
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# =============== #
#    coverage     #
# =============== #

# `--cov` is deliberately NOT in `addopts`. The threshold below is measured
# against the *whole* suite, and the pre-commit gate runs `-m "not integration"`
# - which never executes `CRUDRepository` - so an always-on `--cov` would fail
# every commit on a number that says nothing about the change being committed.
# Coverage is a separate, explicit run:
#
#     uv run --frozen pytest --cov    # needs Docker; integration suite included
#
[tool.coverage.run]
source = ["src"]
# Branch coverage as well as line: the interesting gaps in this codebase are
# `if debug`, `if self.message` and the like, where both lines run either way.
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# The suite currently sits at 91%; the shortfall is `src/cli/` and `src/main.py`
# - process entrypoints, deliberately not omitted, because hiding them would
# make the number say something it does not mean.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
]
